modLoader = "javafml"
loaderVersion = "[32,)"
#issueTrackerURL = ""
license = "${license}"
clientSideOnly = true

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
logoFile = "${mod_icon}"
features = { java_version = "[8,17]"}

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[36,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.16.1, 1.16.5]"
ordering = "NONE"
side = "CLIENT"
