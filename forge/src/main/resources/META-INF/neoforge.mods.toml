modLoader = "javafml"
loaderVersion = "0"
#issueTrackerURL = ""
license = "${license}"
clientSideOnly = true

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''
${description}
'''
logoFile = "${mod_icon}"
features = { java_version = "17"}

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.2, 1.21.5]"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "sound_gc.mixins.json"
