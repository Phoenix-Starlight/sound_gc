import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

architectury {
    common rootProject.enabled_platforms.split(',')
    injectInjectables = false
}

configurations {
    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    shadowBundle(implementation "com.github.ben-manes.caffeine:caffeine:2.9.3")
}

abstract class ReflectionShadowJar extends ShadowJar {}

// Includes select reflection accessed classes
tasks.register('shadowReflected', ReflectionShadowJar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'reflected'
    include "*.jar"
    include "**/SSA.class"
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'shadow'
    dependencies {
        exclude(dependency("com.google.errorprone:.*:.*"))
        exclude(dependency("org.checkerframework.*:.*:.*"))
    }
    minimize()
}

jar {
    from(zipTree shadowJar.archiveFile)
    from(zipTree shadowReflected.archiveFile)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
